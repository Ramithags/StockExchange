/*
 * This file was generated by the Gradle 'init' task.
 */

plugins {
    id 'java'
    id 'maven-publish'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web:3.3.4'
    implementation 'io.springfox:springfox-bean-validators:3.0.0'
    implementation  'org.springframework.boot:spring-boot-starter-data-mongodb:3.3.4'
    implementation "com.google.code.gson:gson:2.8.5"
    testImplementation "junit:junit:4.12"
    implementation 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'
}

// Use your own unique group identifier here (e.g., com.yourcompany.project)
group = 'com.sg.stockexchange'
version = '0.0.1-SNAPSHOT'
description = 'exchange-service'
sourceCompatibility = '17'

publishing {
    publications {
        maven(MavenPublication) {
            from(components.java)
        }
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}